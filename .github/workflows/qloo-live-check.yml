name: Qloo live check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/live-check.mjs
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
      # Save raw Qloo responses (no key inside) to a separate branch for review.
      - name: Publish results to the live-results branch
        run: |
          if grep -q "${{ secrets.QLOO_API_KEY }}" results/live-check.json; then echo "key found in output, refusing"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-results
          git rm -rq --cached .
          git add -f results/live-check.json
          git commit -qm "Qloo live check results"
          git push -f origin live-results
