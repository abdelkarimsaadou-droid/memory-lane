name: Qloo live check
on:
  workflow_dispatch:
  push:
    paths: ["lib/**", "scripts/live-check.mjs", ".github/workflows/qloo-live-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/live-check.mjs
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
