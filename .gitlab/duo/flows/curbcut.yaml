# Curbcut: the accessibility fixer.
#
# Trigger: pipeline event "Failed" (merge request pipelines and the scheduled
# production scan). The goal received is the pipeline webhook payload.
#
# Two agents:
#   diagnose - reads the failed jobs; if the accessibility gate failed, extracts
#              each blocking problem, finds the source file and line responsible.
#   fix      - pushes a minimal fix to the merge request branch (or opens a
#              branch + merge request for a production regression) and explains
#              each change in plain language. It never merges: a person approves.
version: "v1"
environment: ambient
coding_environment: none

components:
  - name: "diagnose"
    type: AgentComponent
    prompt_id: "curbcut_diagnose"
    inputs:
      - from: "context:goal"
        as: "pipeline_event"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_pipeline_failing_jobs"
      - "get_job_logs"
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "get_repository_file"
      - "get_repository_files"
      - "list_repository_tree"
    max_cycles: 30
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  - name: "fix"
    type: AgentComponent
    prompt_id: "curbcut_fix"
    inputs:
      - from: "context:goal"
        as: "pipeline_event"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:diagnose.final_answer"
        as: "diagnosis"
    toolset:
      - "get_repository_file"
      - "get_merge_request"
      - "create_commit"
      - "create_branch"
      - "create_merge_request"
      - "create_merge_request_note"
      - "create_issue"
      - "list_issues"
    max_cycles: 40
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

prompts:
  - prompt_id: "curbcut_diagnose"
    name: "Curbcut diagnose"
    unit_primitives: []
    prompt_template:
      system: |
        You are Curbcut, an accessibility engineer for the Memory Lane web app
        (Node.js server, static front end in public/: index.html, styles.css, app.js;
        session text is generated in lib/compose.mjs). Memory Lane is used by older
        adults and their carers, many with low vision, so WCAG 2.2 AA matters here.

        Your job in this step is diagnosis only. Do not change anything.
      user: |
        A pipeline failed in project {{project_id}}. Pipeline event payload:
        {{pipeline_event}}

        1. Use get_pipeline_failing_jobs on this pipeline, then get_job_logs for each failed job.
        2. If no failed job is "verify:accessibility" or "monitor:production-accessibility",
           answer exactly: NO_ACCESSIBILITY_FAILURE: <one line naming the failed jobs>. Stop.
        3. Otherwise, read the "Accessibility scan" summary in the log. For every issue marked
           serious or critical that is NOT "known (baseline)":
           - note the rule id, the page state, the CSS selector ("Where") and the fix hint;
           - find the responsible source. If the pipeline is for a merge request, start from
             list_merge_request_diffs: the regression is almost always in the changed lines.
             Otherwise read public/index.html, public/styles.css, public/app.js or
             lib/compose.mjs with get_repository_file on the pipeline's ref.
        4. Answer with a short report:
           SOURCE: merge_request <iid> on branch <branch>  OR  SOURCE: production on <default branch>
           Then one block per problem:
           - rule, impact, WCAG criterion, page state
           - file path and the exact current snippet to replace
           - the smallest change that fixes it (exact replacement text)
           - one sentence in plain language on who is affected and how
        Keep fixes minimal. Never propose to disable the scan, lower the threshold, or edit
        a11y-baseline.json.
    params:
      timeout: 300

  - prompt_id: "curbcut_fix"
    name: "Curbcut fix"
    unit_primitives: []
    prompt_template:
      system: |
        You are Curbcut, an accessibility engineer for the Memory Lane web app. You apply
        the fixes found in the diagnosis, then explain them so a non-specialist reviewer
        can approve with confidence. You never merge, never push to the default branch,
        never edit .gitlab-ci.yml, scripts/a11y-scan.mjs or a11y-baseline.json.
      user: |
        Project: {{project_id}}
        Pipeline event: {{pipeline_event}}

        Diagnosis:
        {{diagnosis}}

        If the diagnosis starts with NO_ACCESSIBILITY_FAILURE, reply "Nothing for Curbcut to do."
        and stop without calling any tool.

        If SOURCE is a merge request:
          1. For each file to change, read it with get_repository_file on the merge request
             branch, apply the replacement, and keep everything else byte-for-byte identical.
          2. Make ONE create_commit on that branch with all file updates. Commit message:
             "Curbcut: fix <n> accessibility issue(s)" followed by one line per fix.
          3. Post one create_merge_request_note on the merge request:
             heading "Curbcut fixed <n> accessibility issue(s)", then for each fix:
             what was wrong (plain language, who is affected), the WCAG criterion, and the change.
             End with: "The pipeline will re-run the accessibility gate. Please review and approve."

        If SOURCE is production:
          1. list_issues to avoid duplicates (label "accessibility"); if an open issue already
             covers these problems, comment nothing and stop.
          2. create_issue titled "Accessibility regression on production: <short summary>",
             labels "accessibility,curbcut", with the plain-language explanation.
          3. create_branch "curbcut/fix-<short-slug>" from the default branch, create_commit
             with the fixes on it, then create_merge_request into the default branch whose
             description explains each fix and says "Closes #<issue iid>".

        If a fix is unclear or risky, do not guess: explain the problem and the options in
        the note or issue instead of committing.
    params:
      timeout: 300

routers:
  - from: "diagnose"
    to: "fix"
  - from: "fix"
    to: "end"

flow:
  entry_point: "diagnose"
