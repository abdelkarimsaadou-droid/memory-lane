# Curbcut: accessibility as a release gate for Memory Lane.
#
# Every merge request is scanned against WCAG 2.2 AA in six real states of the
# app (desktop, phone, print, English, French, error state). New serious or
# critical problems fail the pipeline; the Curbcut Duo flow is triggered by
# that failure, diagnoses it from the job log and pushes a fix to the merge
# request for a human to approve (supervised autonomy).
#
# Stages map to the DevSecOps lifecycle the hackathon scores:
#   verify  - syntax checks and the accessibility scan
#   secure  - secret detection and SAST
#   package - container image in the GitLab registry
#   release - deploy to production after the gates pass, then smoke test
#   monitor - scheduled scan of production; a failure wakes the Curbcut flow
#   govern  - public accessibility statement and conformance report (Pages)

stages: [verify, secure, package, release, monitor, govern]

variables:
  PRODUCTION_URL: "https://memory-lane-8dv1.onrender.com"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.64.0-noble"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

.node:
  image: $PLAYWRIGHT_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

verify:syntax:
  extends: .node
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - for f in server.mjs lib/*.mjs scripts/*.mjs public/app.js; do node --check "$f"; done

# The release gate. Runs the app locally in demo mode (no secrets needed) and
# scans it. The full plain-language summary is printed in the job log, which is
# what the Curbcut flow reads when this job fails.
verify:accessibility:
  extends: .node
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  variables:
    QLOO_MODE: demo
    PORT: "3000"
    RATE_LIMIT_PER_MIN: "200"
  script:
    - node server.mjs > server.log 2>&1 &
    - for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
    - node scripts/a11y-scan.mjs --url http://localhost:3000 --out a11y-results
  after_script:
    - cat a11y-results/summary.md || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [a11y-results/]
    reports:
      junit: a11y-results/junit.xml
      codequality: a11y-results/codequality.json

secret_detection:
  stage: secure

semgrep-sast:
  stage: secure

package:image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Production only moves after the accessibility gate and the security scans
# passed on the default branch. RENDER_DEPLOY_HOOK is a masked CI/CD variable.
release:production:
  stage: release
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $RENDER_DEPLOY_HOOK
  environment:
    name: production
    url: $PRODUCTION_URL
  script:
    - curl -sf -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
    - echo "Deploy requested; waiting for the new version to answer."
    - sleep 120
    - for i in $(seq 1 30); do curl -sf "$PRODUCTION_URL/api/health" && exit 0; sleep 10; done; exit 1

# Daily scan of the live site. A failure here triggers the Curbcut flow, which
# opens an issue and a fix merge request.
monitor:production-accessibility:
  extends: .node
  stage: monitor
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - node scripts/a11y-scan.mjs --url "$PRODUCTION_URL" --out a11y-results
  after_script:
    - cat a11y-results/summary.md || true
  artifacts:
    when: always
    expire_in: 90 days
    paths: [a11y-results/]
    reports:
      junit: a11y-results/junit.xml

# Public accessibility statement + conformance report, rebuilt from the latest
# scan. The European Accessibility Act expects services to publish one.
pages:
  stage: govern
  image: $PLAYWRIGHT_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: verify:accessibility
      optional: true
    - job: monitor:production-accessibility
      optional: true
  script:
    - node scripts/accessibility-statement.mjs --report a11y-results/report.json --out site
  pages:
    publish: site
  artifacts:
    paths: [site/]
